services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hrmanagement
      POSTGRES_USER: hrapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=hrmanagement;Username=hrapp;Password=${POSTGRES_PASSWORD:-localdevpass}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
