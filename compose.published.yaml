services:
  credential-init:
    image: postgres:17-alpine
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -s /credentials/postgres_password ]; then
          umask 022
          od -An -N32 -tx1 /dev/urandom | tr -d '[:space:]' > /credentials/postgres_password.tmp
          mv /credentials/postgres_password.tmp /credentials/postgres_password
        fi
        test "$(wc -c < /credentials/postgres_password)" -eq 64
    volumes:
      - db_credentials:/credentials

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hrmanagement
      POSTGRES_USER: hrapp
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - db_credentials:/run/secrets:ro
    depends_on:
      credential-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    image: ghcr.io/smr-25/hrmanagementapp:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=hrmanagement;Username=hrapp"
      DatabasePasswordFile: /run/secrets/postgres_password
    volumes:
      - db_credentials:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  db_credentials:
