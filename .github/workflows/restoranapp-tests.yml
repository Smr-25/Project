name: Restaurant security and integration tests
on:
  workflow_call:
  push:
    paths:
      - 'RestoranApp/**'
      - '.github/workflows/restoranapp-tests.yml'
      - 'tests/**'
      - 'package*.json'
  pull_request:
    paths:
      - 'RestoranApp/**'
      - '.github/workflows/restoranapp-tests.yml'
      - 'tests/**'
      - 'package*.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test RestaurantApp.sln --configuration Release
        working-directory: RestoranApp
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=low
