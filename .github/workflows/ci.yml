name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore HRManagementApp.slnx
      - name: Build
        run: dotnet build HRManagementApp.slnx --configuration Release --no-restore --warnaserror
      - name: Test
        run: dotnet test HRManagementApp.slnx --configuration Release --no-build --no-restore
      - name: Build Docker image
        run: docker build --tag hrmanagementapp:ci .
