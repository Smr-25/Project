name: Continuous integration

on:
  push:
    branches:
      - main
      - portfolio-restaurant
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore RestaurantApp.sln

      - name: Build solution
        run: dotnet build RestaurantApp.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test tests/RestaurantApp.UnitTests/RestaurantApp.UnitTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults/unit

      - name: Run PostgreSQL integration tests
        run: >-
          dotnet test tests/RestaurantApp.IntegrationTests/RestaurantApp.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults/integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: error
          retention-days: 14

  container-build:
    name: Verify container image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: restaurant-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
